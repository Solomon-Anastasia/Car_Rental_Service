<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Login</title>

        <link rel="icon" type="image/x-icon" th:href="@{/images/rentARide.png.ico}" />
        <link rel="icon" type="image/png" th:href="@{/images/rentARide.png}" />
        <link rel="icon" type="image/svg+xml" th:href="@{/images/rentARide.png.svg}" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

        <link th:href="@{/css/registerLoginStyle.min.css}" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/script.js}"></script>
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container px-5">
                <a class="navbar-brand" th:href="@{/home}">Rent A Ride</a>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" th:href="@{/home}">Home</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/rent}">Rent Car</a></li>

                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" id="navbarDropdownLogIn" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Log In</a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownBlog">
                                <li><a class="dropdown-item" th:href="@{/register}">Create Account</a></li>
                                <li><a class="dropdown-item" th:href="@{/login}">Log In</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <header class="bg-dark py-5">
            <div class="container px-5">
                <div class="row justify-content-center">
                    <div class="text-center text-white my-5">
                        <h1 class="display-5 fw-bolder text-white mb-2">Welcome back!</h1>
                    </div>
                </div>
            </div>
        </header>

        <div class="container" style="width: 80%; margin-top: 4rem; margin-bottom: 4rem;">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <div class="row justify-content-center align-items-center" style="margin-top: 4rem; margin-bottom: 4rem;">
                        <div class="col-lg-7">
                            <div class="p-5">
                                <form th:action="@{/login}" method="post"
                                        class="customer fs-4 mb-4">
                                    <div class="form-group mb-4">
                                        <input style="font-size: 1.1rem;" type="email" class="form-control form-control-customer" id="exampleInputEmail" placeholder="name@example.com"  name="email" required>
                                    </div>
                                    <div class="form-group row">
                                        <div class="form-group mb-4">
                                            <input style="font-size: 1.1rem;" type="password" class="form-control form-control-customer" id="exampleInputPassword" placeholder="password" name="password" required>
                                        </div>
                                    </div>

                                    <div style="margin-bottom: 2rem; margin-top: 3rem;" id="credentialsMatchToast" class="toast toast-no-border mx-auto" role="alert" aria-live="assertive" aria-atomic="true">
                                        <div class="toast-header">
                                            <strong class="mr-auto">Invalid credentials</strong>
                                            <button type="button" class="ml-2 mb-1 close" data-dismiss="toast" aria-label="Close" onclick="closeLoginToast()">
                                                <span aria-hidden="true">&times;</span>
                                            </button>
                                        </div>
                                        <div class="toast-body">
                                            Invalid email or password!
                                        </div>
                                    </div>
                                    <input type="hidden" id="showToast" th:value="${showToast}" />

                                    <input style="font-size: 1.1rem;" class="btn btn-primary btn-customer btn-block mt-4" value="Login" type="submit">
                                </form>
                                <hr>

                                <div class="text-center">
                                    <a class="small btn btn-lg px-4 me-sm-3" style="background-color: #f2f2f2; border-radius: 10rem; font-size: 1.1rem;"
                                       th:href="@{/register}"
                                       onmouseover="this.classList.remove('btn-secondary'); this.classList.add(this.style.backgroundColor='#0d6efc'); this.classList.add('text-white');"
                                       onmouseout="this.classList.remove('btn-primary'); this.classList.remove('text-white'); this.style.backgroundColor='#f2f2f2';">
                                        Don't have an account? Register!
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="py-5 bg-dark">
            <div class="container"><p class="m-0 text-left text-white">Copyright &copy; Rent a Ride 2023</p></div>
        </footer>
    </body>
</html>
